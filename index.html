<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>team14 雙滑桿遙控器</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      margin: 0; padding: 16px;
      height: 100dvh; width: 100vw;
      background: #121418; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .status { font-size: 14px; color: #94a3b8; }
    .status.connected { color: #4ade80; }
    .btn {
      padding: 10px 18px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-connect { background: #3b82f6; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }

    .controls {
      flex: 1; display: flex; align-items: center; justify-content: space-around;
      gap: 24px; padding: 12px 0;
    }
    .panel {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .label { font-size: 14px; color: #cbd5e1; letter-spacing: 0.5px; }

    /* 垂直滑桿（前後） */
    .track-v {
      position: relative; width: 76px; height: 240px;
      background: #1e293b; border-radius: 38px;
      border: 2px solid #334155;
    }
    .track-v::before {
      content: ""; position: absolute; left: 10px; right: 10px; top: 50%;
      height: 2px; background: #475569; transform: translateY(-50%);
    }

    /* 水平滑桿（左右） */
    .track-h {
      position: relative; width: 240px; height: 76px;
      background: #1e293b; border-radius: 38px;
      border: 2px solid #334155;
    }
    .track-h::before {
      content: ""; position: absolute; top: 10px; bottom: 10px; left: 50%;
      width: 2px; background: #475569; transform: translateX(-50%);
    }

    /* 滑塊 */
    .thumb {
      position: absolute; width: 64px; height: 64px;
      border-radius: 50%; background: #38bdf8;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.45);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #thumbX { background: #f59e0b; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.45); }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="connectBtn" class="btn btn-connect">連線 team14</button>
    <div id="statusText" class="status">未連線</div>
    <button id="stopBtn" class="btn btn-stop">急停</button>
  </div>

  <div class="controls">
    <div class="panel">
      <div class="label">前後油門：<span id="valY">0</span></div>
      <div id="trackY" class="track-v"><div id="thumbY" class="thumb"></div></div>
    </div>

    <div class="panel">
      <div class="label">左右轉向：<span id="valX">0</span></div>
      <div id="trackX" class="track-h"><div id="thumbX" class="thumb"></div></div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let bleDevice = null;
    let rxChar = null;
    let isWriting = false;
    let pendingPayload = null;

    let currentX = 0; // -100 ~ 100
    let currentY = 0; // -100 ~ 100
    let lastSendTime = 0;

    const statusText = document.getElementById('statusText');
    const connectBtn = document.getElementById('connectBtn');
    const stopBtn    = document.getElementById('stopBtn');
    const valXEl     = document.getElementById('valX');
    const valYEl     = document.getElementById('valY');

    // 傳送 BLE 指令（含防塞車佇列）
    async function sendBLE(text, force = false) {
      if (!rxChar) return;
      const now = Date.now();
      if (!force && now - lastSendTime < 50) return; // 每 50ms 最多送一次
      lastSendTime = now;

      if (isWriting) {
        pendingPayload = text;
        return;
      }

      isWriting = true;
      try {
        const data = new TextEncoder().encode(text);
        if (rxChar.properties.writeWithoutResponse) {
          await rxChar.writeValueWithoutResponse(data);
        } else {
          await rxChar.writeValue(data);
        }
      } catch (err) {
        console.warn('BLE 傳送失敗:', err);
      } finally {
        isWriting = false;
        if (pendingPayload !== null) {
          const next = pendingPayload;
          pendingPayload = null;
          sendBLE(next, true);
        }
      }
    }

    function pushState(force = false) {
      valXEl.textContent = currentX;
      valYEl.textContent = currentY;
      sendBLE(`${currentX},${currentY}`, force);
    }

    // 綁定支援多指觸控的滑桿（放開自動回中）
    function setupSlider(trackEl, thumbEl, isVertical, onChange) {
      const updateFromPointer = (e) => {
        const rect = trackEl.getBoundingClientRect();
        const maxOffset = (isVertical ? rect.height : rect.width) / 2 - 36;
        let offset = isVertical
          ? (e.clientY - (rect.top + rect.height / 2))
          : (e.clientX - (rect.left + rect.width / 2));

        offset = Math.max(-maxOffset, Math.min(maxOffset, offset));
        thumbEl.style.transform = isVertical
          ? `translate(-50%, calc(-50% + ${offset}px))`
          : `translate(calc(-50% + ${offset}px), -50%)`;

        // 垂直滑桿往上為正 (+100)，水平滑桿往右為正 (+100)
        const ratio = isVertical ? (-offset / maxOffset) : (offset / maxOffset);
        onChange(Math.round(ratio * 100), false);
      };

      const reset = () => {
        thumbEl.style.transform = 'translate(-50%, -50%)';
        onChange(0, true); // 歸零時強制立即送出
      };

      trackEl.addEventListener('pointerdown', (e) => {
        trackEl.setPointerCapture(e.pointerId);
        updateFromPointer(e);
      });
      trackEl.addEventListener('pointermove', (e) => {
        if (trackEl.hasPointerCapture(e.pointerId)) updateFromPointer(e);
      });
      trackEl.addEventListener('pointerup', reset);
      trackEl.addEventListener('pointercancel', reset);
    }

    setupSlider(document.getElementById('trackY'), document.getElementById('thumbY'), true, (v, force) => {
      currentY = v;
      pushState(force);
    });

    setupSlider(document.getElementById('trackX'), document.getElementById('thumbX'), false, (v, force) => {
      currentX = v;
      pushState(force);
    });

    // 連線 / 斷線按鈕
    connectBtn.addEventListener('click', async () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }
      try {
        statusText.textContent = '搜尋中...';
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'team14' }],
          optionalServices: [SERVICE_UUID]
        });
        bleDevice.addEventListener('gattserverdisconnected', () => {
          rxChar = null;
          statusText.textContent = '已斷線';
          statusText.classList.remove('connected');
          connectBtn.textContent = '連線 team14';
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(CHAR_RX_UUID);

        statusText.textContent = '已連線 team14';
        statusText.classList.add('connected');
        connectBtn.textContent = '斷線';
      } catch (err) {
        statusText.textContent = '連線取消或失敗';
        console.error(err);
      }
    });

    // 急停按鈕
    stopBtn.addEventListener('click', () => {
      currentX = 0;
      currentY = 0;
      valXEl.textContent = '0';
      valYEl.textContent = '0';
      sendBLE('S', true);
    });
  </script>
</body>
</html>
