<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Team14 Mecanum Controller</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #111111;
      --border: #3a3a3a;
      --border-strong: #ffffff;
      --text: #ffffff;
      --muted: #888888;
      --thumb-size: clamp(40px, 12dvh, 52px);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: max(8px, env(safe-area-inset-top))
               max(10px, env(safe-area-inset-right))
               max(8px, env(safe-area-inset-bottom))
               max(10px, env(safe-area-inset-left));
      gap: 8px;
    }

    /* Top Bar - Single Row, Compact */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .topbar::-webkit-scrollbar { display: none; }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      background: #000000;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    button.primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    button.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    button.danger {
      background: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
    }

    button:disabled { opacity: 0.35; pointer-events: none; }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 7px;
      background: #000000;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .badge.ok   { color: #ffffff; border-color: #ffffff; }
    .badge.warn { color: #cccccc; border-color: #888888; }
    .badge.low  { color: #ffffff; border-color: #ffffff; border-style: dashed; }

    /* Main Control Area */
    .main {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 0;
      min-width: 0;
    }

    .zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 0;
      min-width: 0;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
      line-height: 1;
    }

    /* Responsive Sliders & Joystick */
    .track {
      position: relative;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .track-v {
      width: clamp(54px, 14dvh, 70px);
      height: clamp(130px, 54dvh, 210px);
    }

    .track-h {
      width: clamp(130px, 32vw, 210px);
      height: clamp(50px, 15dvh, 66px);
    }

    .joy-pad {
      position: relative;
      width: clamp(140px, 54dvh, 210px);
      height: clamp(140px, 54dvh, 210px);
      background: radial-gradient(circle, #181818 60%, #050505 100%);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .thumb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .disabled {
      opacity: 0.28;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    /* Center Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .act-btn {
      width: clamp(82px, 15vw, 108px);
      height: clamp(46px, 18dvh, 62px);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: var(--panel);
      color: #ffffff;
      border: 1.5px solid var(--border);
    }

    .act-btn.pressed {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: scale(0.96);
    }

    .right-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3dvh, 18px);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="group">
        <button id="connectBtn" class="primary">CONNECT</button>
        <span id="statusBadge" class="badge">DISCONNECTED</span>
        <span id="batBadge" class="badge">12V: --% (--.-V)</span>
      </div>
      <div class="group">
        <button id="modeBtn">MODE: SLIDER</button>
        <button id="gyroBtn">GYRO: OFF</button>
        <button id="rezeroBtn" class="hidden">ZERO</button>
        <button id="fsBtn">FULL</button>
      </div>
    </div>

    <div class="main">
      <!-- Left: Throttle (Slider) OR 360° Joystick -->
      <div class="zone">
        <div id="leftSliderWrap" class="zone">
          <div class="label">THROTTLE (Y)</div>
          <div id="trackY" class="track track-v"><div id="thumbY" class="thumb"></div></div>
        </div>
        <div id="joyWrap" class="zone hidden">
          <div class="label">360° MOVE (X / Y)</div>
          <div id="joyPad" class="joy-pad"><div id="joyThumb" class="thumb"></div></div>
        </div>
      </div>

      <!-- Center: Fire (Toggle) & Defend (Hold) -->
      <div class="actions">
        <button id="fireBtn" class="act-btn">FIRE</button>
        <button id="defendBtn" class="act-btn">DEFEND</button>
      </div>

      <!-- Right: Strafe (Slider mode) + Rotate (Always available) -->
      <div class="zone right-stack">
        <div id="strafeWrap" class="zone">
          <div class="label">STRAFE (X)</div>
          <div id="trackX" class="track track-h"><div id="thumbX" class="thumb"></div></div>
        </div>
        <div class="zone">
          <div class="label">ROTATE (R)</div>
          <div id="trackR" class="track track-h"><div id="thumbR" class="thumb"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== Protocol & BLE Constants ====================
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const PKT_AUTH    = 0xAA;
    const PKT_BATTERY = 0xBB;
    const PKT_CONTROL = 0xCC;
    const AUTH_PACKET = new Uint8Array([PKT_AUTH, 0x88, 0x42]);

    const LOOP_MS      = 33;   // ~30Hz single control loop
    const HEARTBEAT_MS = 150;  // Keep-alive interval
    const MAX_RETRIES  = 3;    // Auto-reconnect cap for Bluefy stability

    // ==================== State ====================
    const state = { x: 0, y: 0, r: 0, fire: false, defend: false };

    let device = null;
    let rxChar = null;
    let txChar = null;
    let manualDisconnect = false;
    let retryCount = 0;
    let wakeLock = null;

    let isWriting = false;
    let pendingBytes = null;
    let lastPacketKey = '';
    let lastSentMs = 0;

    let joyMode = false;
    let gyroEnabled = false;

    // ==================== DOM References ====================
    const connectBtn  = document.getElementById('connectBtn');
    const statusBadge = document.getElementById('statusBadge');
    const batBadge    = document.getElementById('batBadge');
    const modeBtn     = document.getElementById('modeBtn');
    const gyroBtn     = document.getElementById('gyroBtn');
    const rezeroBtn   = document.getElementById('rezeroBtn');
    const fsBtn       = document.getElementById('fsBtn');

    const leftSliderWrap = document.getElementById('leftSliderWrap');
    const strafeWrap     = document.getElementById('strafeWrap');
    const joyWrap        = document.getElementById('joyWrap');

    const trackY = document.getElementById('trackY'), thumbY = document.getElementById('thumbY');
    const trackX = document.getElementById('trackX'), thumbX = document.getElementById('thumbX');
    const trackR = document.getElementById('trackR'), thumbR = document.getElementById('thumbR');
    const joyPad = document.getElementById('joyPad'), joyThumb = document.getElementById('joyThumb');

    const fireBtn   = document.getElementById('fireBtn');
    const defendBtn = document.getElementById('defendBtn');

    // ==================== Fullscreen Toggle ====================
    function getFullscreenEl() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function updateFsBtn() {
      const isFs = Boolean(getFullscreenEl());
      fsBtn.textContent = isFs ? 'EXIT' : 'FULL';
      fsBtn.classList.toggle('active', isFs);
    }

    fsBtn.addEventListener('click', async () => {
      try {
        if (!getFullscreenEl()) {
          const root = document.documentElement;
          if (root.requestFullscreen) {
            await root.requestFullscreen();
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (err) {
        // iOS Safari / Bluefy may restrict Fullscreen API
      }
      updateFsBtn();
    });

    document.addEventListener('fullscreenchange', updateFsBtn);
    document.addEventListener('webkitfullscreenchange', updateFsBtn);

    // ==================== Helpers: Encoding & Shaping ====================
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // Expo nonlinear curve (8% deadzone + 70% square / 30% linear mix)
    function shapeAxis(v, dz = 0.08) {
      const a = Math.abs(v);
      if (a < dz) return 0;
      const n = (a - dz) / (1 - dz);
      return Math.round(Math.sign(v) * (0.7 * n * n + 0.3 * n) * 100);
    }

    // [0xCC, x:int8, y:int8, r:int8, flags:u8] (5 bytes, matches ESP32)
    function encodeControl(s) {
      const buf = new Uint8Array(5);
      const dv = new DataView(buf.buffer);
      buf[0] = PKT_CONTROL;
      dv.setInt8(1, clamp(s.x, -100, 100));
      dv.setInt8(2, clamp(s.y, -100, 100));
      dv.setInt8(3, clamp(s.r, -100, 100));
      buf[4] = (s.fire ? 1 : 0) | (s.defend ? 2 : 0);
      return buf;
    }

    function parseTelemetry(dv) {
      if (dv.byteLength < 3 || dv.getUint8(0) !== PKT_BATTERY) return;
      const pct = dv.getUint8(1);
      const volts = (dv.getUint8(2) / 10).toFixed(1);
      batBadge.textContent = `12V: ${pct}% (${volts}V)`;
      batBadge.className = 'badge ' + (pct <= 20 ? 'low' : pct <= 45 ? 'warn' : 'ok');
    }

    // ==================== BLE Write Queue & Single 30Hz Loop ====================
    async function enqueueWrite(bytes) {
      if (!rxChar) return;
      if (isWriting) {
        pendingBytes = bytes;
        return;
      }
      isWriting = true;
      try {
        if (rxChar.writeValueWithoutResponse) {
          await rxChar.writeValueWithoutResponse(bytes);
        } else {
          await rxChar.writeValue(bytes);
        }
      } catch (err) {
        // Ignore transient GATT busy errors; loop/heartbeat will recover
      } finally {
        isWriting = false;
        if (pendingBytes) {
          const next = pendingBytes;
          pendingBytes = null;
          enqueueWrite(next);
        }
      }
    }

    setInterval(() => {
      if (!rxChar) return;
      const pkt = encodeControl(state);
      const key = pkt.join(',');
      const now = performance.now();
      if (key !== lastPacketKey || now - lastSentMs >= HEARTBEAT_MS) {
        lastPacketKey = key;
        lastSentMs = now;
        enqueueWrite(pkt);
      }
    }, LOOP_MS);

    // ==================== WakeLock & Background Failsafe ====================
    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function syncFireBtn() {
      fireBtn.classList.toggle('pressed', state.fire);
      fireBtn.textContent = state.fire ? 'FIRE: ON' : 'FIRE';
    }

    function resetAllControls() {
      state.x = state.y = state.r = 0;
      state.fire = state.defend = false;
      [thumbX, thumbY, thumbR, joyThumb].forEach(t => t.style.transform = 'translate(-50%, -50%)');
      syncFireBtn();
      defendBtn.classList.remove('pressed');
      if (rxChar) {
        const pkt = encodeControl(state);
        lastPacketKey = pkt.join(',');
        lastSentMs = performance.now();
        enqueueWrite(pkt);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        resetAllControls();
      } else if (rxChar) {
        acquireWakeLock();
      }
    });

    // ==================== BLE Connection & Auto-Reconnect ====================
    function setStatus(text, cls = '') {
      statusBadge.textContent = text;
      statusBadge.className = 'badge ' + cls;
    }

    function onTxNotify(e) {
      parseTelemetry(e.target.value);
    }

    async function connectGatt(dev) {
      setStatus('CONNECTING...', 'warn');
      const server = await dev.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      rxChar = await service.getCharacteristic(CHAR_RX_UUID);
      txChar = await service.getCharacteristic(CHAR_TX_UUID);

      if (rxChar.writeValueWithoutResponse) {
        await rxChar.writeValueWithoutResponse(AUTH_PACKET);
      } else {
        await rxChar.writeValue(AUTH_PACKET);
      }

      txChar.removeEventListener('characteristicvaluechanged', onTxNotify);
      txChar.addEventListener('characteristicvaluechanged', onTxNotify);
      await txChar.startNotifications();

      retryCount = 0;
      lastPacketKey = '';
      setStatus('CONNECTED', 'ok');
      connectBtn.textContent = 'DISCONNECT';
      connectBtn.classList.remove('primary');
      connectBtn.classList.add('danger');
      acquireWakeLock();
    }

    function onDisconnected() {
      rxChar = null;
      txChar = null;
      isWriting = false;
      pendingBytes = null;
      state.fire = state.defend = false;
      syncFireBtn();
      defendBtn.classList.remove('pressed');
      releaseWakeLock();

      if (manualDisconnect || !device) {
        setStatus('DISCONNECTED');
        connectBtn.textContent = 'CONNECT';
        connectBtn.classList.remove('danger');
        connectBtn.classList.add('primary');
        return;
      }

      if (retryCount < MAX_RETRIES) {
        retryCount++;
        const delayMs = 600 * Math.pow(2, retryCount - 1);
        setStatus(`RECONNECTING (${retryCount}/${MAX_RETRIES})`, 'warn');
        setTimeout(() => {
          if (!manualDisconnect && device && !device.gatt.connected) {
            connectGatt(device).catch(() => onDisconnected());
          }
        }, delayMs);
      } else {
        setStatus('DISCONNECTED', 'low');
        connectBtn.textContent = 'CONNECT';
        connectBtn.classList.remove('danger');
        connectBtn.classList.add('primary');
      }
    }

    connectBtn.addEventListener('click', async () => {
      if (device && device.gatt.connected) {
        manualDisconnect = true;
        resetAllControls();
        device.gatt.disconnect();
        return;
      }

      try {
        manualDisconnect = false;
        if (!device) {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
          });
          device.addEventListener('gattserverdisconnected', onDisconnected);
        }
        await connectGatt(device);
      } catch (err) {
        setStatus('DISCONNECTED');
        console.error('BLE error:', err);
      }
    });

    // ==================== Unified Pad Component (1D Sliders + 2D Joystick) ====================
    function setupPad(el, thumb, { lockX = false, lockY = false, onChange }) {
      let activeId = null;
      let rect = null;
      let maxRx = 1, maxRy = 1;

      const update = (e) => {
        let dx = lockX ? 0 : e.clientX - (rect.left + rect.width / 2);
        let dy = lockY ? 0 : e.clientY - (rect.top + rect.height / 2);

        if (!lockX && !lockY) {
          const d = Math.hypot(dx, dy);
          if (d > maxRx) {
            dx *= maxRx / d;
            dy *= maxRx / d;
          }
        } else {
          dx = clamp(dx, -maxRx, maxRx);
          dy = clamp(dy, -maxRy, maxRy);
        }

        thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        onChange(lockX ? 0 : dx / maxRx, lockY ? 0 : -dy / maxRy);
      };

      el.addEventListener('pointerdown', (e) => {
        if (activeId !== null) return;
        activeId = e.pointerId;
        el.setPointerCapture(activeId);
        rect = el.getBoundingClientRect();
        const thumbR = (thumb.offsetWidth || 46) / 2;
        maxRx = Math.max(1, rect.width / 2 - thumbR);
        maxRy = Math.max(1, rect.height / 2 - thumbR);
        update(e);
      });

      el.addEventListener('pointermove', (e) => {
        if (e.pointerId === activeId) update(e);
      });

      const end = (e) => {
        if (e.pointerId !== activeId) return;
        activeId = null;
        thumb.style.transform = 'translate(-50%, -50%)';
        onChange(0, 0);
      };

      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    }

    setupPad(trackY, thumbY, { lockX: true,  onChange: (_, ny) => { if (!gyroEnabled) state.y = shapeAxis(ny); } });
    setupPad(trackX, thumbX, { lockY: true,  onChange: (nx, _) => { if (!gyroEnabled) state.x = shapeAxis(nx); } });
    setupPad(trackR, thumbR, { lockY: true,  onChange: (nx, _) => { state.r = shapeAxis(nx); } });
    setupPad(joyPad, joyThumb, {
      onChange: (nx, ny) => {
        if (!gyroEnabled) {
          state.x = shapeAxis(nx);
          state.y = shapeAxis(ny);
        }
      }
    });

    // ==================== Action Buttons (Fire: Toggle / Defend: Hold) ====================
    fireBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      state.fire = !state.fire;
      syncFireBtn();
    });

    function setupHoldBtn(btn, key) {
      let activeId = null;
      btn.addEventListener('pointerdown', (e) => {
        if (activeId !== null) return;
        activeId = e.pointerId;
        btn.setPointerCapture(activeId);
        state[key] = true;
        btn.classList.add('pressed');
      });
      const release = (e) => {
        if (e.pointerId !== activeId) return;
        activeId = null;
        state[key] = false;
        btn.classList.remove('pressed');
      };
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
    }

    setupHoldBtn(defendBtn, 'defend');

    // ==================== Mode Switch (Slider <-> 360° Joy) ====================
    modeBtn.addEventListener('click', () => {
      joyMode = !joyMode;
      modeBtn.textContent = joyMode ? 'MODE: 360° JOY' : 'MODE: SLIDER';
      leftSliderWrap.classList.toggle('hidden', joyMode);
      strafeWrap.classList.toggle('hidden', joyMode);
      joyWrap.classList.toggle('hidden', !joyMode);
      if (!gyroEnabled) {
        state.x = 0;
        state.y = 0;
      }
    });

    // ==================== Gyroscope (Tilt Degrees + Stronger Anti-Shake Filter) ====================
    let baseTiltX = null, baseTiltY = null;
    let smoothTiltX = 0, smoothTiltY = 0;
    let lastMotionMs = 0;
    const GYRO_TAU_MS = 160; // Stronger smoothing against hand tremor

    function accelToDeg(a) {
      return Math.asin(clamp(a / 9.81, -1, 1)) * (180 / Math.PI);
    }

    // 8° deadzone, 32° full speed, gentle 75% expo curve
    function shapeGyroDeg(deltaDeg, dzDeg = 8, maxDeg = 32) {
      const a = Math.abs(deltaDeg);
      if (a <= dzDeg) return 0;
      const n = clamp((a - dzDeg) / (maxDeg - dzDeg), 0, 1);
      return Math.round(Math.sign(deltaDeg) * (0.75 * n * n + 0.25 * n) * 100);
    }

    function syncMoveVisuals(x, y) {
      if (joyMode) {
        const rect = joyPad.getBoundingClientRect();
        if (rect.width > 0) {
          const maxR = rect.width / 2 - (joyThumb.offsetWidth || 46) / 2;
          let dx = (x / 100) * maxR;
          let dy = (-y / 100) * maxR;
          const d = Math.hypot(dx, dy);
          if (d > maxR) { dx *= maxR / d; dy *= maxR / d; }
          joyThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
      } else {
        const rx = trackX.getBoundingClientRect();
        const ry = trackY.getBoundingClientRect();
        if (rx.width > 0) {
          const offX = (x / 100) * (rx.width / 2 - (thumbX.offsetWidth || 46) / 2);
          thumbX.style.transform = `translate(calc(-50% + ${offX}px), -50%)`;
        }
        if (ry.height > 0) {
          const offY = (-y / 100) * (ry.height / 2 - (thumbY.offsetHeight || 46) / 2);
          thumbY.style.transform = `translate(-50%, calc(-50% + ${offY}px))`;
        }
      }
    }

    function handleMotion(e) {
      if (!gyroEnabled) return;
      const ag = e.accelerationIncludingGravity;
      if (!ag || ag.x === null || ag.y === null || ag.z === null) return;

      const angle = (screen.orientation && screen.orientation.angle !== undefined)
        ? screen.orientation.angle
        : (window.orientation || 0);

      let rawAx = 0, rawAy = 0;
      if (angle === 90) {
        rawAx = -ag.y; rawAy = ag.z;
      } else if (angle === 270 || angle === -90) {
        rawAx = ag.y;  rawAy = ag.z;
      } else {
        rawAx = ag.x;  rawAy = ag.z;
      }

      const degX = accelToDeg(rawAx);
      const degY = accelToDeg(rawAy);
      const now = performance.now();

      if (baseTiltX === null || baseTiltY === null) {
        baseTiltX = smoothTiltX = degX;
        baseTiltY = smoothTiltY = degY;
        lastMotionMs = now;
        return;
      }

      const dt = clamp(now - lastMotionMs, 1, 200);
      lastMotionMs = now;
      const alpha = 1 - Math.exp(-dt / GYRO_TAU_MS);

      smoothTiltX += alpha * (degX - smoothTiltX);
      smoothTiltY += alpha * (degY - smoothTiltY);

      state.x = shapeGyroDeg(smoothTiltX - baseTiltX);
      state.y = shapeGyroDeg(smoothTiltY - baseTiltY);
      syncMoveVisuals(state.x, state.y);
    }

    function setXYTouchDisabled(disabled) {
      trackX.classList.toggle('disabled', disabled);
      trackY.classList.toggle('disabled', disabled);
      joyPad.classList.toggle('disabled', disabled);
    }

    rezeroBtn.addEventListener('click', () => {
      baseTiltX = null;
      baseTiltY = null;
    });

    gyroBtn.addEventListener('click', async () => {
      if (gyroEnabled) {
        gyroEnabled = false;
        baseTiltX = baseTiltY = null;
        window.removeEventListener('devicemotion', handleMotion);
        gyroBtn.textContent = 'GYRO: OFF';
        gyroBtn.classList.remove('active');
        rezeroBtn.classList.add('hidden');
        setXYTouchDisabled(false);
        state.x = 0;
        state.y = 0;
        syncMoveVisuals(0, 0);
        return;
      }

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const res = await DeviceMotionEvent.requestPermission();
          if (res !== 'granted') {
            alert('Motion permission denied.');
            return;
          }
        } catch (err) {
          alert('Gyroscope permission error: ' + err.message);
          return;
        }
      }

      baseTiltX = null;
      baseTiltY = null;
      gyroEnabled = true;
      window.addEventListener('devicemotion', handleMotion);
      gyroBtn.textContent = 'GYRO: ON';
      gyroBtn.classList.add('active');
      rezeroBtn.classList.remove('hidden');
      setXYTouchDisabled(true);
    });
  </script>
</body>
</html>
